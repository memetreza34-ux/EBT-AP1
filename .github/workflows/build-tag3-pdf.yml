name: Build Tag 3 AP1 Study Guide PDF

on:
  push:
    paths:
      - 'LF2/Tag_3_Ultra_Lernskript_Schutz_und_Netzsysteme.md'
      - 'scripts/build_tag3_pdf_from_md.py'
      - '.github/workflows/build-tag3-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag3-pdf-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: python -m pip install mistune weasyprint pypdf
      - name: Render and verify Tag 3 PDF
        run: python scripts/build_tag3_pdf_from_md.py
      - name: Commit PDF to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LF2/Tag_3_Ultra_Lernskript_Schutz_und_Netzsysteme.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(lf2): publish Tag 3 PDF summary'
            git push
          fi
